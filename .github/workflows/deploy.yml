name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fonts
        run: scripts/install-fonts.sh fonts
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      # システムフォントに頼らず，取得したフォントと Typst 同梱フォントだけでビルドする
      - run: typst compile --ignore-system-fonts --font-path fonts main.typ main.pdf
      - name: Create page directory
        run: |
          mkdir _pages
          mv ./main.pdf ./_pages/main.pdf
          echo "<meta http-equiv=\"refresh\" content=\"0;URL='$(gh api "repos/$GITHUB_REPOSITORY" --jq '.html_url')'\">" > ./_pages/index.html
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
